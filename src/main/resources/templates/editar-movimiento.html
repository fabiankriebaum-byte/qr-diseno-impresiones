
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar movimiento - QR Diseño</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 650px;
            margin: 25px auto;
            padding: 0 15px;
            background: #f3f5f7;
            color: #222;
        }
        h1 { color: #17365d; }
        .panel {
            background: white;
            padding: 20px;
            margin-top: 18px;
            border-radius: 10px;
            box-shadow: 0 2px 7px #0001;
        }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input, select, button {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 5px;
            font-size: 16px;
        }
        button {
            background: #17365d;
            color: white;
            border: 0;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 18px;
        }
        a { display: block; margin-top: 18px; color: #17365d; }
    </style>
</head>
<body>
    <h1>QR Diseño e Impresiones</h1>

    <section class="panel">
        <h2>Editar movimiento</h2>

        <form th:action="@{/movimientos/{id}/editar(id=${movimiento.id})}"
              method="post">

            <label for="tipo">Tipo de movimiento</label>
            <select id="tipo" name="tipo" required>
                <option value="INGRESO"
                        th:selected="${movimiento.tipo == 'INGRESO'}">
                    Ingreso
                </option>
                <option value="EGRESO"
                        th:selected="${movimiento.tipo == 'EGRESO'}">
                    Egreso
                </option>
            </select>

            <label for="concepto">Concepto</label>
            <input id="concepto" name="concepto" maxlength="200"
                   th:value="${movimiento.concepto}" required>

            <label for="importe">Importe ($)</label>
            <input id="importe" name="importe" type="number"
                   min="0.01" step="0.01"
                   th:value="${movimiento.importe}" required>

            <label for="medioPago">Medio de pago</label>
            <select id="medioPago" name="medioPago" required>
                <option value="EFECTIVO"
                        th:selected="${movimiento.medioPago == 'EFECTIVO'}">
                    Efectivo
                </option>
                <option value="TRANSFERENCIA"
                        th:selected="${movimiento.medioPago == 'TRANSFERENCIA'}">
                    Transferencia
                </option>
                <option value="OTRO"
                        th:selected="${movimiento.medioPago == 'OTRO'}">
                    Otro
                </option>
            </select>

            <button type="submit">Guardar corrección</button>
        </form>

        <a th:href="@{/(fecha=${movimiento.fecha})}">
            Volver sin guardar
        </a>
    </section>
</body>
</html>
